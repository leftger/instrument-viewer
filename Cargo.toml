[package]
name = "mdo-viewer"
version = "0.1.0"
edition = "2021"
description = "Live waveform viewer for Tektronix MDO3000-series scopes over SCPI TCP"
license = "MIT"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
eframe = "0.32"
egui_plot = "0.33"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"
thiserror = "2"
