[package]
name = "instrument-viewer"
version = "0.1.0"
edition = "2021"
description = "Live waveform viewer for Tektronix MDO3000 and Rigol DHO900 scopes over SCPI TCP"
license = "MIT"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.32", features = ["wgpu"] }
egui_plot = "0.33"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"
scpi = { version = "1", default-features = false, features = ["std"] }
mdns-sd = "0.21"
thiserror = "2"
nusb = "0.2"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
