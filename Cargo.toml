[package]
name = "instrument-viewer"
version = "0.1.0"
edition = "2021"
description = "Live viewer for Tektronix and Rigol scopes, a Siglent generator, and Keysight E36200 supplies"
license = "MIT OR Apache-2.0"
repository = "https://github.com/leftger/instrument-viewer"
readme = "./README.md"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.32", features = ["wgpu"] }
egui_plot = "0.33"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"
scpi = { version = "1", default-features = false, features = ["std"] }
mdns-sd = "0.21"
thiserror = "2"
nusb = "0.2"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"

[build-dependencies]
serde_yaml_ng = "0.10"
